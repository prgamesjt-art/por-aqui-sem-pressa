<!doctype html>
<html lang="pt-BR">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07110d;--bg2:#0c1b15;--panel:#102219;--emerald:#10b981;--mint:#6ee7b7;--soft:#b9d9c5;--text:#eef8f1;--muted:#8eaa98;--gold:#cbb77d;--line:rgba(110,231,183,.2);}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh;overflow-x:hidden}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
#app{min-height:100svh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 9%,#183725 0%,#0c1b15 40%,#07110d 80%)}
.sky{position:absolute;inset:0;pointer-events:none}.starsbg{position:absolute;inset:0;opacity:.65;background-image:radial-gradient(1px 1px at 12% 20%,#e7f8ed,transparent),radial-gradient(1px 1px at 25% 9%,#c5f3d3,transparent),radial-gradient(1px 1px at 82% 30%,#e7f8ed,transparent),radial-gradient(2px 2px at 91% 15%,#c7f4d5,transparent),radial-gradient(1px 1px at 66% 7%,#fff,transparent),radial-gradient(1px 1px at 42% 24%,#d7f8df,transparent),radial-gradient(1px 1px at 55% 13%,#fff,transparent)}
.moon{position:absolute;top:8%;right:12%;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#f1f6d9,#d1e7bd 55%,#9ab997);box-shadow:0 0 50px rgba(160,220,174,.14)}.moon:after{content:"";position:absolute;width:83px;height:83px;border-radius:50%;background:#0d1c14;top:-7px;left:22px}
.top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:22px clamp(16px,5vw,64px)}.brand{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:#b5d5c1}.sound{border:1px solid var(--line);background:#07170fbd;color:#c4dfcf;border-radius:999px;padding:10px 14px;font-size:12px;backdrop-filter:blur(10px)}
.hero{position:relative;z-index:2;text-align:center;padding:5vh 18px 2vh}.kicker{font-size:10px;text-transform:uppercase;letter-spacing:.22em;color:var(--mint)}h1{font:400 clamp(40px,7vw,76px) "Caveat",Georgia,serif;letter-spacing:-.04em;margin:13px 0}.hero p{max-width:510px;margin:auto;color:#b1c8b7;line-height:1.7;font-size:14px}
.map{position:relative;z-index:2;width:min(1050px,96vw);height:min(510px,54vh);min-height:380px;margin:1vh auto}.trail{position:absolute;inset:0;opacity:.32}.trail svg{width:100%;height:100%}.point{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;flex-direction:column;gap:7px;border:0;background:none;color:var(--soft);padding:0;transition:transform .25s,opacity .35s}.point:hover{transform:translate(-50%,-50%) scale(1.06)}.orb{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:#081b11c9;border:1px solid rgba(110,231,183,.35);box-shadow:0 0 24px rgba(16,185,129,.1);backdrop-filter:blur(6px);transition:.4s}.point .label{font-size:12px;text-shadow:0 2px 8px #000;white-space:nowrap}.point .sub{font-size:10px;color:#7fa993}.point.visited .orb{opacity:.45;box-shadow:none;border-color:#3b7959}.point.visited .label{color:#7fa993}.point.visited .orb:after{content:"✓";font-size:10px;position:absolute;transform:translate(18px,16px);color:var(--mint)}.point.locked{opacity:.5}.point.locked .orb{border-color:rgba(203,183,125,.4);box-shadow:none}
#library{left:20%;top:31%}#constellations{left:50%;top:18%}#archive{left:80%;top:34%}#respiro{left:35%;top:79%}#notes{left:14%;top:60%}#letter-point{left:48%;top:51%}
.progress-wrap{position:relative;z-index:2;display:flex;justify-content:flex-end;padding:0 clamp(18px,5vw,64px) 22px}.progress{border:1px solid var(--line);border-radius:13px;padding:12px 15px;background:#06150dbd;backdrop-filter:blur(10px);min-width:150px}.count{font:20px Georgia,serif;color:var(--mint)}.count-caption{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin-top:3px}.footer{position:relative;z-index:2;text-align:center;color:#607c6a;font-size:11px;padding:0 12px 22px}
.treeline{position:absolute;bottom:0;left:0;width:100%;height:32%;pointer-events:none;opacity:.75}.treeline svg{width:100%;height:100%}
.backdrop{position:fixed;inset:0;z-index:10;background:#020805b9;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px}.backdrop.show{display:flex;animation:fade .25s}.modal{width:min(740px,100%);max-height:90svh;overflow:auto;background:linear-gradient(145deg,#12261a,#07150d);border:1px solid rgba(110,231,183,.17);border-radius:23px;padding:clamp(20px,4vw,40px);box-shadow:0 24px 80px #0008;animation:rise .3s}.close{float:right;position:sticky;top:0;border:1px solid var(--line);background:#0a1910;color:#b6d5c2;border-radius:50%;width:36px;height:36px;z-index:4}.modal-kicker{color:var(--mint);font-size:10px;text-transform:uppercase;letter-spacing:.2em}.modal h2{font:400 clamp(28px,4vw,42px) Georgia,serif;margin:10px 0}.intro{color:#abc3b4;line-height:1.65;margin:0 0 20px}.box{border:1px solid var(--line);border-radius:17px;background:#06140c80;padding:18px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.btn{border:1px solid rgba(110,231,183,.3);border-radius:999px;padding:11px 15px;background:#133725;color:#e7f5ec}.btn:hover{border-color:var(--mint)}.ghost{background:transparent;border-color:var(--line);color:#aec9b8}.reading{font:16px/1.9 Georgia,serif;color:#dceee2}.quote{font:italic 19px/1.6 Georgia,serif;text-align:center;color:#d7eee0;padding:12px 0}.stars{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}.starbtn{border:0;background:none;color:#c9e9d1;display:flex;flex-direction:column;align-items:center;gap:6px;width:90px;padding:10px}.star{font-size:34px;text-shadow:0 0 22px #7dd9a6;transition:all .6s}.starbtn.off .star{opacity:.16;filter:grayscale(1);transform:scale(.65);text-shadow:none}.starbtn.off small{color:#536b5a}.starbtn small{font-size:10px;color:#83a991}.terminal{font:13px/1.8 monospace;color:#85d6a6;background:#031009;border:1px solid rgba(52,211,153,.18);border-radius:12px;padding:15px}.file{display:block;width:100%;border:0;border-bottom:1px solid #1c3826;background:none;color:#91d7ab;padding:10px;text-align:left}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.options button{border:1px solid var(--line);background:#102219;color:#b6d5c2;border-radius:12px;padding:12px;text-align:left}.options button:hover{border-color:var(--mint);color:#fff}.options button{transition:opacity .25s,transform .25s}.page-transition{animation:rise .35s}textarea{width:100%;margin:8px 0;border-radius:12px;border:1px solid var(--line);background:#06120b;color:#e6f4eb;padding:12px;line-height:1.6}.note{font-size:12px;color:#819c89;line-height:1.6}.musicviz{height:150px;display:grid;place-items:center;border-radius:15px;background:radial-gradient(ellipse,rgba(16,185,129,.12),transparent 65%);position:relative;overflow:hidden}.musicviz:before,.musicviz:after{content:"";position:absolute;border:1px solid rgba(110,231,183,.18);border-radius:50%;width:110px;height:110px;animation:pulse 3s infinite}.musicviz:after{width:75px;height:75px;animation-delay:1s}.musicviz span{font-size:36px;color:var(--mint);z-index:1}
.envelope-stage{min-height:300px;display:grid;place-items:center;padding:15px}.envelope{position:relative;width:min(360px,92%);height:220px;border-radius:8px;overflow:hidden;background:linear-gradient(140deg,#b9a981,#e0d1a9 55%,#c7b48e);display:grid;place-items:center;box-shadow:0 18px 45px #0005;color:#464432;touch-action:none}.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 49%,#a89770 50%,transparent 51%),linear-gradient(225deg,transparent 49%,#b4a17b 50%,transparent 51%);opacity:.28}.address{z-index:1;text-align:center;font:22px Georgia,serif}.address small{display:block;font:10px system-ui;text-transform:uppercase;letter-spacing:.17em;margin-bottom:8px;color:#6a634e}.seal{position:absolute;z-index:3;bottom:24px;left:50%;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;border:2px solid #873a2b;background:radial-gradient(circle at 30% 25%,#c17157,#842c23 70%);display:grid;place-items:center;color:#f0c8a6;touch-action:none;user-select:none}.seal.crack{animation:crack .35s forwards}.envelope.fadeout{animation:fade .4s forwards}.letter{background:#e9e0c9;color:#373c2e;border-radius:8px;padding:clamp(18px,4vw,30px);font:16px/1.9 Georgia,serif;min-height:290px;box-shadow:0 10px 30px #0003}.letter h3{font:20px Georgia,serif;margin:0 0 15px;color:#46513d}.letterpage{display:none;animation:fade .3s}.letterpage.active{display:block}.pagebar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:15px;color:#aac4b2;font-size:12px}.pagebar button{border:1px solid var(--line);background:#0d2015;color:#c4dfcf;border-radius:999px;padding:10px 12px}.pagebar button:disabled{opacity:.35;cursor:not-allowed}.toast{display:none;position:fixed;z-index:50;bottom:22px;left:50%;transform:translateX(-50%);max-width:90vw;background:#10251a;border:1px solid rgba(110,231,183,.2);border-radius:14px;padding:12px 16px;color:#d6eee0;box-shadow:0 20px 50px #0005}.toast.show{display:block;animation:rise .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{transform:scale(.7);opacity:.2}50%{transform:scale(1.2);opacity:.5}}@keyframes crack{to{transform:translateX(-50%) scale(.55) rotate(20deg);opacity:0}}
@media(max-width:640px){.top{padding:17px}.hero{padding-top:4vh}.map{height:430px;min-height:430px;width:96vw}#library{left:20%;top:26%}#constellations{left:50%;top:12%}#archive{left:80%;top:29%}#respiro{left:35%;top:82%}#notes{left:14%;top:58%}#letter-point{left:48%;top:47%}.orb{width:44px;height:44px}.point .label{font-size:11px}.backdrop{padding:10px;align-items:flex-end}.modal{max-height:92svh;border-radius:22px;padding:20px 17px}.options{grid-template-columns:1fr}.envelope{height:205px}.progress-wrap{padding:0 15px 18px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Layout polish: spacing, typography, and mobile comfort */
.hero h1{line-height:1.05;text-shadow:0 8px 40px rgba(0,0,0,.24)}

.youtube-wrap{position:fixed;width:200px;height:200px;left:-1000px;top:0;overflow:hidden;pointer-events:none;opacity:.01;z-index:-1}.youtube-wrap iframe{width:200px;height:200px;border:0}
</style>
</head>
<body>
<div id="app">
<div class="sky"><div class="starsbg"></div><div class="moon"></div></div>
<header class="top"><div class="brand">Um pequeno lugar no mundo</div><button class="sound" id="sound">♪ ouvir ambiente</button></header>
<section class="hero"><div class="kicker">um mapa feito de pequenas pausas</div><h1>Por aqui, sem pressa.</h1><p>Não precisa resolver tudo hoje. Explore quando quiser, fique um pouco em cada canto e leve só o que fizer bem.</p></section>
<main class="map" aria-label="Mapa de descobertas">
<div class="trail"><svg viewBox="0 0 1000 500" preserveAspectRatio="none"><path d="M180 150 C260 60,410 75,500 100 S780 150,790 180 C820 270,730 360,690 350 S470 410,350 380 S170 300,140 280 S170 170,180 150" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="3 12"/><path d="M480 255 C540 190,640 250,690 350" fill="none" stroke="#6ee7b7" stroke-width="1" stroke-dasharray="2 10"/></svg></div>
<button class="point" id="library" data-place="library"><span class="orb">📚</span><span class="label">Biblioteca</span><span class="sub">leituras breves</span></button>
<button class="point" id="constellations" data-place="stars"><span class="orb">✦</span><span class="label">Constelações</span><span class="sub">pequenos sinais</span></button>
<button class="point" id="archive" data-place="archive"><span class="orb">🗃</span><span class="label">Arquivo</span><span class="sub">pequenos registros</span></button>

<button class="point" id="respiro" data-place="music"><span class="orb">♫</span><span class="label">Respiro</span><span class="sub">som e calma</span></button>
<button class="point" id="notes" data-place="journal"><span class="orb">✎</span><span class="label">Notas</span><span class="sub">só seu</span></button>
<button class="point locked" id="letter-point" data-place="letter"><span class="orb">✉</span><span class="label">A carta</span><span class="sub" id="letter-sub">6 lugares restantes</span></button>
</main>
<div class="treeline" aria-hidden="true"><svg viewBox="0 0 1400 260" preserveAspectRatio="none"><path fill="#06130b" d="M0 260V140L80 60 155 140V260 M120 260V90L230 10 340 90V260 M270 260V130L380 45 490 130V260 M450 260V80L560 0 670 80V260 M620 260V120L740 35 850 120V260 M820 260V80L930 5 1040 80V260 M1010 260V140L1120 45 1230 140V260 M1200 260V110L1300 20 1400 110V260"/></svg></div>
<section class="progress-wrap"><div class="progress"><div class="count" id="count">00 / 05</div><div class="count-caption">lugares descobertos</div></div></section>
<div class="footer">um lugar para visitar sem obrigação de ficar</div>
</div>
<div class="backdrop" id="backdrop" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true"><button class="close" id="close" aria-label="Fechar">×</button><div id="content"></div></section></div>
<div class="toast" id="toast"></div>

<!-- Player da faixa enviada pelo Pedro. O player fica fora da área visual; os controles do site comandam a reprodução. -->
<div id="youtube-api-loader" aria-hidden="true"></div>
<script>"use strict";(() => {
const required=['library','stars','archive','music','journal'];
const visited=new Set(),foundStars=new Set(),usedBooks=new Set(),usedLogs=new Set();
const backdrop=document.getElementById('backdrop'),content=document.getElementById('content'),count=document.getElementById('count'),letterPoint=document.getElementById('letter-point'),letterSub=document.getElementById('letter-sub');
let page=0,sealDone=false,holdTimer=null,dragY=null,toastTimer=null;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200)}
function progress(){count.textContent=String(visited.size).padStart(2,'0')+' / 05';const ids={library:'library',stars:'constellations',archive:'archive',music:'respiro',journal:'notes'};required.forEach(id=>document.getElementById(ids[id])?.classList.toggle('visited',visited.has(id)));const left=required.length-visited.size;letterPoint.classList.toggle('locked',left>0);letterSub.textContent=left?`${left} lugares restantes`:'liberada'}
function mark(id){if(required.includes(id)&&!visited.has(id)){visited.add(id);progress()}}
function closeModal(){backdrop.classList.remove('show');backdrop.setAttribute('aria-hidden','true');content.innerHTML='';holdTimer&&clearTimeout(holdTimer);holdTimer=null;dragY=null}
document.getElementById('close').addEventListener('click',closeModal);backdrop.addEventListener('pointerdown',e=>{if(e.target===backdrop)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&backdrop.classList.contains('show'))closeModal()});
function open(html){content.innerHTML=html;backdrop.classList.add('show');backdrop.setAttribute('aria-hidden','false');content.closest('.modal').scrollTop=0;if(content.querySelector('#journal')){try{content.querySelector('#journal').value=localStorage.getItem('emilly-notes')||''}catch{}}}
function head(k,t,d){return `<div class="modal-kicker">${k}</div><h2>${t}</h2><p class="intro">${d}</p>`}
function openPlace(id){if(id==='letter'&&visited.size<required.length){toast(`A carta está guardada. Faltam ${required.length-visited.size} lugares para descobrir.`);return}if(id!=='letter')mark(id);const views={library:libraryView,stars:starsView,archive:archiveView,music:musicView,journal:journalView,letter:letterView};if(views[id])open(views[id]())}
document.querySelectorAll('.point').forEach(b=>b.addEventListener('click',()=>openPlace(b.dataset.place)));
// Biblioteca: as opções desaparecem depois de abertas.
const fragments={
quiet:'Se hoje você não conseguiu fazer tudo, não transforme isso em motivo para se tratar mal. Você também merece paciência. Faça o que der, descanse quando puder e recomece sem precisar se explicar.',
care:'Nem todo dia precisa ser produtivo ou bonito. Às vezes, o melhor que você consegue fazer é atravessar o dia com calma. Isso também é suficiente.',
hope:'Não precisa ter certeza de como tudo vai dar certo. Basta deixar uma pequena possibilidade aberta. A vida ainda pode surpreender de maneiras boas.',
kind:'Tente falar consigo mesma como falaria com alguém que ama e que está cansado. Você merece ouvir palavras gentis também, especialmente de si mesma.'};
const bookLabels={quiet:'Um lembrete de calma',care:'Sobre se cuidar',hope:'Um pouco de esperança',kind:'Gentileza consigo'};
function libraryView(){return `${head('Biblioteca','Só mais leituras breves','Escolha algo para ler. As opções vão desaparecendo conforme você avança, sem pressa nem cobrança.')}<div class="box"><div class="options" id="book-options">${Object.keys(fragments).filter(k=>!usedBooks.has(k)).map(k=>`<button data-book="${k}">${bookLabels[k]}</button>`).join('')}</div><div class="reading" id="book-output" style="margin-top:16px"></div></div><div class="row"><button class="btn ghost" data-back>Voltar ao mapa</button></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-book]');if(!b)return;const key=b.dataset.book;if(usedBooks.has(key))return;usedBooks.add(key);b.remove();const out=document.getElementById('book-output');if(out){out.textContent=fragments[key];out.classList.remove('page-transition');void out.offsetWidth;out.classList.add('page-transition')}fx('page')});
const starTexts=['Você não precisa estar bem o tempo inteiro. Descansar também faz parte de continuar.','Um dia difícil não define quem você é, nem determina como serão os próximos.','Mesmo quando parece pouco, cada passo que você dá tem valor.','Você merece coisas boas sem precisar conquistar o direito de recebê-las.','Que hoje exista pelo menos um instante em que você consiga respirar mais leve.'];
function starsView(){return `${head('Constelações','Pequenos sinais','Toque nas estrelas. Cada uma guarda uma mensagem e se apaga depois de descoberta.')}<div class="box"><div class="stars">${starTexts.map((s,i)=>`<button class="starbtn ${foundStars.has(i)?'off':''}" data-star="${i}" ${foundStars.has(i)?'disabled':''}><span class="star">✦</span><small>${foundStars.has(i)?'apagada':'sinal '+(i+1)}</small></button>`).join('')}</div><div class="quote" id="star-message">Escolha uma estrela.</div></div><div class="row"><button class="btn ghost" data-back>Voltar ao mapa</button></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-star]');if(!b)return;const i=+b.dataset.star;if(foundStars.has(i))return;foundStars.add(i);mark('stars');fx('star');b.classList.add('off');b.disabled=true;b.querySelector('small').textContent='apagada';const m=document.getElementById('star-message');if(m){m.textContent=starTexts[i];m.classList.remove('page-transition');void m.offsetWidth;m.classList.add('page-transition')}});
const logs=[['Um dia puxado','Não precisa analisar cada detalhe de um dia ruim. Ele aconteceu, terminou e não define você. Se puder, descansa. Amanhã é uma nova oportunidade, sem obrigação de ser perfeito.'],['Pausa necessária','Parar por alguns minutos não é perder tempo. Às vezes, é exatamente o que permite seguir depois.'],['Pequenas coisas','Uma bebida que você gosta, uma conversa tranquila, uma música boa ou alguns minutos de silêncio também podem ser importantes.'],['Lembrete','Você não precisa resolver tudo de uma vez. Escolha uma coisa de cada vez, e permita que o resto espere.']];
function archiveView(){return `${head('Arquivo','Pequenos lembretes','Abra os registros que quiser. Depois de lidos, eles saem da lista.')}<div class="terminal"><div id="log-list">${logs.map((x,i)=>usedLogs.has(i)?'':`<button class="file" data-log="${i}">▸ ${x[0]}</button>`).join('')}</div><div id="log-output" style="padding-top:12px">Escolha um registro.</div></div><div class="row"><button class="btn ghost" data-back>Voltar ao mapa</button></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-log]');if(!b)return;const i=+b.dataset.log;if(usedLogs.has(i))return;usedLogs.add(i);b.remove();const out=document.getElementById('log-output');if(out)out.textContent=logs[i][1];fx('page')});
// Faixa do YouTube enviada pelo Pedro. Controles próprios do site; player sem interface visível.
const YT_VIDEO_ID='yUWYEBwZwFQ';let playing=false,ytPlayer=null,ytReady=false,wantPlayOnReady=false,apiRequested=false;const soundButton=document.getElementById('sound');
function updateSoundButtons(){if(soundButton)soundButton.textContent=playing?'♫ pausar música':'♪ ouvir música';const modalButton=document.getElementById('music-modal-toggle');if(modalButton){modalButton.textContent=playing?'Pausar música':'Tocar música';modalButton.setAttribute('aria-pressed',playing?'true':'false')}}
function loadYTApi(){if(window.YT&&window.YT.Player){createYTPlayer();return}if(apiRequested)return;apiRequested=true;const script=document.createElement('script');script.id='yt-api-script';script.src='https://www.youtube.com/iframe_api';script.onerror=()=>{apiRequested=false;toast('Não foi possível carregar a música. Confira sua conexão e tente novamente.')};document.head.appendChild(script);window.onYouTubeIframeAPIReady=()=>createYTPlayer()}
function createYTPlayer(){if(ytPlayer||!window.YT||!window.YT.Player)return;const host=document.getElementById('youtube-player');if(!host)return;ytPlayer=new YT.Player('youtube-player',{videoId:YT_VIDEO_ID,width:'200',height:'200',playerVars:{autoplay:0,controls:0,playsinline:1,rel:0,modestbranding:1,enablejsapi:1},events:{onReady:(event)=>{ytReady=true;event.target.setVolume(100);if(wantPlayOnReady){event.target.playVideo();wantPlayOnReady=false}},onStateChange:(event)=>{playing=event.data===YT.PlayerState.PLAYING;updateSoundButtons()},onError:(event)=>{playing=false;wantPlayOnReady=false;updateSoundButtons();toast('O YouTube bloqueou a reprodução desta faixa incorporada (código '+event.data+'). Isso não é problema da sua internet.')}}})}
function toggleSound(){if(!backdrop.classList.contains('show')||!document.getElementById('youtube-player')){wantPlayOnReady=true;openPlace('music');loadYTApi();return}if(!ytReady){wantPlayOnReady=true;loadYTApi();return}if(playing){ytPlayer.pauseVideo();wantPlayOnReady=false}else{wantPlayOnReady=false;ytPlayer.playVideo()}updateSoundButtons()}
if(soundButton)soundButton.addEventListener('click',toggleSound);
// Efeitos visuais discretos; sem áudio sintetizado.
function fx(kind){/* efeitos sonoros desativados */}
function musicView(){setTimeout(loadYTApi,0);return `${head('Sala de respiro','Uma pausa','Deixe a música tocar e fique aqui pelo tempo que quiser.')}<div class="box"><div class="musicviz"><span>♫</span></div><div class="youtube-wrap" aria-hidden="true"><div id="youtube-player"></div></div><p class="quote">Não precisa prestar atenção. Só deixa o som acompanhar.</p><div class="row" style="justify-content:center"><button class="btn" id="music-modal-toggle" aria-pressed="${playing?'true':'false'}">${playing?'Pausar música':'Tocar música'}</button></div><p class="note" style="text-align:center">A música é controlada por este botão.</p></div><div class="row"><button class="btn ghost" data-back>Voltar ao mapa</button></div>`}
document.addEventListener('click',e=>{if(e.target.id==='music-modal-toggle')toggleSound()});
function journalView(){return `${head('Notas','Um espaço só seu','O texto fica guardado localmente neste navegador e não é enviado.')}<div class="box"><textarea id="journal" rows="8" placeholder="Escreva sem precisar organizar..."></textarea><div class="row"><button class="btn" id="save-notes">Guardar neste dispositivo</button><button class="btn ghost" id="clear-notes">Apagar</button></div><p class="note" id="journal-status">Se limpar os dados do navegador, as notas podem desaparecer.</p></div><div class="row"><button class="btn ghost" data-back>Voltar ao mapa</button></div>`}
document.addEventListener('click',e=>{if(e.target.id==='save-notes'){const t=document.getElementById('journal'),s=document.getElementById('journal-status');try{localStorage.setItem('emilly-notes',t.value);s.textContent='Guardado neste navegador. Não foi enviado.';toast('Notas guardadas localmente')}catch{s.textContent='Não foi possível guardar. Copie o texto antes de sair.'}}if(e.target.id==='clear-notes'){const t=document.getElementById('journal');if(t)t.value='';try{localStorage.removeItem('emilly-notes')}catch{}const s=document.getElementById('journal-status');if(s)s.textContent='Notas apagadas deste navegador.'}});
// Carta: páginas 1, 2 e última preservam o espírito; páginas 3 e 4 foram reescritas.
const letterPages=[
<!-- PÁGINA 1: ajuste livre do texto inicial -->
`<h3>Emilly Rosie,</h3><p>Eu queria que você tivesse um cantinho para respirar, nem que fosse por alguns minutos. Fiz tudo isso pensando em você, na esperança de que, quando os dias estiverem pesados, você possa abrir esse lugar, se distrair um pouco, encontrar alguma coisa que te faça sorrir e lembrar que não precisa enfrentar tudo de uma vez.</p><p>Eu sei que as coisas não estão sendo fáceis. Talvez tenha muita coisa acontecendo por dentro e por fora, talvez você esteja cansada de ter que continuar, mesmo quando parece que a energia acabou. Não vou fingir que tenho uma frase mágica que resolve tudo, porque não tenho. Mas eu queria que você soubesse que estou aqui, que me importo e que, se eu puder ajudar de alguma forma, quero ajudar.</p>`,
<!-- PÁGINA 2: ajuste livre do texto sobre força e descanso -->
`<p>Você é muito mais forte do que talvez consiga enxergar nos dias difíceis. E não digo isso porque acho que você precisa ser forte o tempo inteiro. Pelo contrário: ser forte também é admitir que cansou, respirar, chorar se precisar, pedir ajuda, descansar e voltar quando tiver condições. Você não precisa provar sua força para ninguém.</p><p>Tem algo especial em você que não depende de estar animada, de ter tudo organizado ou de conseguir dar conta de todas as coisas. Você continua sendo você nos dias bons e nos dias em que só quer ficar quietinha. Espero que nunca se esqueça disso, principalmente quando a sua própria cabeça começar a ser dura demais com você.</p>`,
<!-- PÁGINA 3: reescrita — presença e acolhimento -->
`<p>Eu sei que talvez você esteja vivendo uma fase que parece pesada demais, e que nem sempre é fácil explicar o que está sentindo ou encontrar forças para fazer as coisas de sempre. Não quero diminuir o que você está passando, nem tentar resolver tudo com palavras bonitas. Só quero que você saiba que não precisa fingir estar bem comigo.</p><p>Se quiser conversar, eu posso te ouvir. Se não souber o que dizer, tudo bem também. Fiz esse lugar justamente pensando em te oferecer um pouco de distração, carinho e calma quando você precisar. Não é uma cobrança, não é um pedido de resposta e nem espera que você esteja sorrindo o tempo todo. É só um jeito meu de dizer: eu me importo, e você não precisa carregar tudo sozinha.</p>`,
<!-- PÁGINA 4: ajuste livre — faculdade, sonhos e esperança (sem especificar curso) -->
`<p>Não deixa os seus sonhos de lado por causa de uma fase difícil. Eu sei que a faculdade exige muito, que tem dias em que tudo parece cansativo e que, quando a cabeça está cheia, até as coisas que a gente queria muito parecem impossíveis. Mas você não precisa decidir tudo agora, nem dar conta de tudo de uma vez. Descansa quando precisar, reorganiza as coisas e segue no seu tempo.</p><p>Eu acredito em você, Emilly, e sei que você se esforça muito, mesmo quando ninguém vê. Tem pessoas que torcem por você e querem te ver bem. Dias mais leves ainda vão chegar. Talvez você não consiga enxergar isso hoje, mas não significa que eles não estejam vindo. Um passo de cada vez já é suficiente.</p>`,
<!-- PÁGINA 5: encerramento preservado; ajuste livre -->
`<p>Então, por favor, tenta ser gentil consigo mesma. Come alguma coisa, bebe água, descansa, não se cobre por cada minuto do dia. Se hoje foi um dia ruim, deixa ele ser só um dia ruim — não uma definição de quem você é, nem uma previsão de tudo que ainda vai acontecer.</p><p>Eu fiz esse pequeno mundo para te dar força, para te lembrar que você merece acolhimento, cuidado e momentos bons. Espero que ele tenha conseguido, nem que por pouco tempo, deixar seu dia mais leve. E quando fechar esta carta, não precisa levar nenhuma obrigação consigo. Leva apenas o que fizer bem.</p><p>Vai ficar tudo bem, Emilly. Um passo de cada vez. Eu torço por você.</p><p><strong>Com carinho, Pedro.</strong></p>`];
function letterView(){return `${head('Correspondência','Uma carta para você','Um pequeno envelope guardado especialmente para Emilly Rosie.')}<div class="box"><p class="reading">Você encontrou todos os lugares. Agora, se quiser, pode abrir a correspondência com calma.</p><div class="row"><button class="btn" id="show-envelope">Abrir correspondência</button></div></div><div class="row"><button class="btn ghost" data-back>Voltar ao mapa</button></div>`}
function envelopeView(){return `${head('Uma correspondência','Para Emilly Rosie','Destinatária: Emilly Rosie. <!-- EDITAR AQUI: apelidos ou observações -->')}<div class="envelope-stage"><div class="envelope" id="envelope"><div class="address"><small>entregue com cuidado</small>Emilly Rosie</div><button class="seal" id="seal" aria-label="Pressione e segure para quebrar o selo">✦</button></div></div><p class="note" id="envelope-help" style="text-align:center">Pressione e segure o selo para quebrá-lo. Depois, arraste o envelope para baixo.</p><div class="row" style="justify-content:center"><button class="btn ghost" data-back>Voltar</button></div>`}
function showPages(){page=0;content.innerHTML=`${head('Uma carta sem pressa','Leia no seu tempo','')}<div class="letter">${letterPages.map((p,i)=>`<div class="letterpage ${i===0?'active':''}" data-page="${i}">${p}</div>`).join('')}</div><div class="pagebar"><button id="prev" disabled>← Página anterior</button><span id="page-indicator">1 / ${letterPages.length}</span><button id="next">Próxima página →</button></div><div class="row"><button class="btn ghost" data-back>Fechar carta</button></div>`;updatePages()}
function updatePages(){content.querySelectorAll('.letterpage').forEach((p,i)=>p.classList.toggle('active',i===page));const indicator=document.getElementById('page-indicator');if(indicator)indicator.textContent=`${page+1} / ${letterPages.length}`;const prev=document.getElementById('prev'),next=document.getElementById('next');if(prev)prev.disabled=page===0;if(next)next.disabled=page===letterPages.length-1}
document.addEventListener('click',e=>{if(e.target.closest('[data-back]')){closeModal();return}if(e.target.id==='show-envelope'){sealDone=false;open(envelopeView())}if(e.target.id==='next'&&page<letterPages.length-1){page++;updatePages();fx('page')}if(e.target.id==='prev'&&page>0){page--;updatePages();fx('page')}});
let sealPointer=null;document.addEventListener('pointerdown',e=>{if(e.target.id==='seal'&&!sealDone){sealPointer=e.pointerId;holdTimer=setTimeout(()=>{sealDone=true;const s=document.getElementById('seal');if(s)s.classList.add('crack');fx('seal');const help=document.getElementById('envelope-help');if(help)help.textContent='Selo quebrado. Agora arraste o envelope para baixo para abrir.'},850)}});document.addEventListener('pointerup',e=>{if(e.pointerId===sealPointer){clearTimeout(holdTimer);sealPointer=null}});document.addEventListener('pointercancel',()=>{clearTimeout(holdTimer);sealPointer=null});document.addEventListener('pointerdown',e=>{if(sealDone&&e.target.closest('#envelope')&&e.target.id!=='seal')dragY=e.clientY});document.addEventListener('pointermove',e=>{if(dragY!==null&&sealDone&&e.clientY-dragY>45){dragY=null;openEnvelope()}});document.addEventListener('pointerup',()=>dragY=null);
function openEnvelope(){const env=document.getElementById('envelope');if(!env)return;env.classList.add('fadeout');fx('paper');setTimeout(showPages,380)}
progress();
})();
